services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lunchmatch
      POSTGRES_PASSWORD: lunchmatch_dev
      POSTGRES_DB: lunchmatch
    ports:
      - "5432:5432"
    volumes:
      - lunchmatch_pgdata:/var/lib/postgresql/data

volumes:
  lunchmatch_pgdata:
